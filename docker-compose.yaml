version: '3'
services:
  db:
    image: postgres:15.3-alpine
    container_name: updoot-postgres-15.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: "postgres -c 'max_connections=500'"
    environment:
      POSTGRES_DB: updootdb
      POSTGRES_USER: updoot
      POSTGRES_PASSWORD: IAmAnAwesomePassword!
    ports:
      - "5432:5432"
  updoot-web:
    build: .
    command: "bundle exec rails s -p 3000 -b '0.0.0.0'"
    environment:
      DB_HOST: db
      DB_NAME: updootdb
      DB_USERNAME: updoot
      DB_PASSWORD: IAmAnAwesomePassword!
    volumes:
      - .:/app:cached
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  postgres_data: {}
networks:
  default:
    name: updoot_default